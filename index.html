<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUXE ESTATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <a href="index.html" class="logo">LUXE ESTATE</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="properties.html">Properties</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="btn">Contact</a></li>
        </ul>
        <button class="menu-toggle" aria-lable="Toggle menu">&#9776;</button>
      </nav>
    </header>
    <section class="hero">
      <div class="hero-content">
        <h1>Find Your Dream Home</h1>
        <p>Discover exceptional properties designed for your lifestyle.</p>
        <a href="properties.html" class="btn">Explore Properties</a>
      </div>

      <div class="search-bar">
        <div class="search-field">
          <label for="location">Location</label>
          <select id="location">
            <option>Any location</option>
            <option>Dubai</option>
            <option>London</option>
            <option>New Cairo</option>
          </select>
        </div>
        <div class="search-field">
          <label for="type">Property Type</label>
          <select id="type">
            <option>All types</option>
            <option>Villa</option>
            <option>Apartment</option>
            <option>Penthouse</option>
          </select>
        </div>
        <div class="search-field">
          <label for="price">Price</label>
          <select id="price">
            <option>Any price</option>
            <option>Under $1M</option>
            <option>$1M - $3M</option>
            <option>Above $3M</option>
          </select>
        </div>
        <button type="button" class="btn">Search</button>
      </div>
    </section>
    <script src="js/script.js"></script>
  </body>
</html>
